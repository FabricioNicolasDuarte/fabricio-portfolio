<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold KPIs — skadia-data-engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <style>
    :root { color-scheme: dark; --cyan: #22d3ee; --bg: #020617; --line: rgba(34,211,238,.28); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; background: #020617; color: #e2e8f0; }
    .bar { display: flex; justify-content: space-between; align-items: baseline; padding: .75rem 1rem; border-bottom: 1px solid var(--line); font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; padding: 1rem; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr 1fr; } }
    .kpi { border: 1px solid var(--line); background: rgba(8,20,36,.9); padding: .85rem; }
    .kpi label { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #67e8f9; }
    .kpi .v { font-family: "IBM Plex Mono", monospace; font-size: 1.45rem; margin: .35rem 0 .2rem; }
    .kpi .h { font-size: 12px; color: #94a3b8; }
    .meta { padding: 0 1rem 1rem; font-size: 13px; color: #94a3b8; }
    canvas { width: 100%; height: 180px; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 0 1rem 1rem; }
    @media (max-width: 800px) { .charts { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--line); padding: .75rem; }
    .panel h2 { margin: 0 0 .5rem; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #67e8f9; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bar">
    <span>skadia-data-engineering · gold</span>
    <span id="live">logical_date —</span>
  </div>
  <div class="grid" id="kpis"></div>
  <p class="meta" id="meta"></p>
  <div class="charts">
    <div class="panel"><h2>Carga UA/ha</h2><canvas id="c1"></canvas></div>
    <div class="panel"><h2>ITH horas riesgo</h2><canvas id="c2"></canvas></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    function spark(canvas, values, color) {
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.scale(dpr, dpr);
      const nums = values.map((v) => Number(v) || 0);
      const min = Math.min(...nums), max = Math.max(...nums);
      const span = max - min || 1;
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
      nums.forEach((n, i) => {
        const x = (i / Math.max(nums.length - 1, 1)) * (w - 8) + 4;
        const y = h - 8 - ((n - min) / span) * (h - 16);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.stroke();
    }
    async function boot() {
      const [kpis, serie] = await Promise.all([
        fetch("/agtech/data/kpis.json").then((r) => r.json()),
        fetch("/agtech/data/kpis_serie.json").then((r) => r.json()),
      ]);
      $("live").textContent = "logical_date " + kpis.logical_date;
      const cards = [
        ["ADG", kpis.adg_kg_dia.toFixed(2) + " kg/d", "gap ≥ 7 d · clip (−1.2, 2.4) · excl. retiro"],
        ["Carga", kpis.carga_ua_ha.toFixed(3) + " UA/ha", "Σ UA-día / (ha útil × días)"],
        ["ITH riesgo", kpis.ith_riesgo_pct.toFixed(1) + " %", kpis.ith_horas_riesgo + " h / " + kpis.ith_horas_obs + " h"],
        ["BCS < 4", kpis.bcs_bajo_pct.toFixed(1) + " %", "escala 1–9"],
      ];
      $("kpis").innerHTML = cards.map(([l, v, h]) =>
        `<article class="kpi"><label>${l}</label><div class="v">${v}</div><div class="h">${h}</div></article>`
      ).join("");
      $("meta").textContent =
        `${kpis.n_animales_activos} activos / ${kpis.n_animales} · ${kpis.n_pesadas} pesadas · ${kpis.n_ocupacion_filas} cabeza-día · late-arriving ${kpis.late_arriving_pct}% · ventana ${kpis.ventana_dias} d`;
      spark($("c1"), serie.map((r) => r.carga_ua_ha), "#22d3ee");
      spark($("c2"), serie.map((r) => r.ith_h_riesgo), "#4ade80");
    }
    boot();
  </script>
</body>
</html>
